<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>OTP Verification – InstantCheck</title>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">

<!--
    SECURITY NOTE (for future editors of this template):
    - All dynamic values below use th:text (Thymeleaf auto-escapes HTML/JS).
    - Never switch these to th:utext unless the value has been explicitly
      sanitized upstream — th:utext renders raw HTML and reopens XSS risk.
-->

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fafafa;padding:56px 20px;">
    <tr>
        <td align="center">
            <table width="420" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;width:100%;">

                <!-- LOGO -->
                <tr>
                    <td style="padding-bottom:32px;text-align:center;">
                        <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                            <tr>
                                <td style="width:26px;height:26px;background:linear-gradient(135deg,#2E7CF6,#1C4D8D);border-radius:8px;text-align:center;vertical-align:middle;">
                                    <span style="font-size:13px;line-height:26px;">⚡</span>
                                </td>
                                <td style="padding-left:8px;">
                                    <span style="font-size:15px;font-weight:700;color:#0a0a0a;letter-spacing:-0.2px;">InstantCheck</span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- CARD -->
                <tr>
                    <td style="background-color:#ffffff;border-radius:20px;padding:48px 40px;text-align:center;border:1px solid #f0f0f0;border-top:3px solid #2E7CF6;">

                        <div style="font-size:22px;font-weight:600;color:#0a0a0a;margin-bottom:8px;letter-spacing:-0.3px;">
                            Verification code
                        </div>

                        <p style="font-size:14px;color:#8a8a8e;line-height:1.6;margin:0 0 32px;">
                            Use this code to verify your account and start checking in.
                        </p>

                        <div style="background-color:#f5f9ff;border:1.5px dashed #2E7CF6;border-radius:14px;padding:20px;margin-bottom:16px;">
                            <div style="font-size:36px;font-weight:700;color:#1C4D8D;letter-spacing:8px;">
                                <span th:text="${otp}">123456</span>
                            </div>
                        </div>

                        <p style="font-size:13px;color:#b0b0b5;margin:0 0 32px;">
                            Expires in <span style="color:#2E7CF6;font-weight:600;" th:text="${expiryMinutes} + ' minutes'">5 minutes</span>
                        </p>

                        <div style="height:1px;background-color:#f2f2f3;margin:0 0 24px;"></div>

                        <p style="font-size:12.5px;color:#b0b0b5;line-height:1.6;margin:0;">
                            Didn't request this? You can safely ignore this email.<br/>
                            Never share this code with anyone.
                        </p>

                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td style="padding-top:28px;text-align:center;">
                        <p style="font-size:12px;color:#c0c0c5;margin:0 0 6px;">
                            © <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> InstantCheck
                        </p>
                        <p style="font-size:12px;margin:0;">
                            <a href="https://instantcheck.online" style="color:#2E7CF6;text-decoration:none;">instantcheck.online</a>
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
