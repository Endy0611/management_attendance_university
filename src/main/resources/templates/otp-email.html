<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OTP Verification – ICheck</title>
</head>
<body style="margin:0;padding:0;background-color:#f0f2f5;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0f2f5;padding:40px 0;">
    <tr>
        <td align="center">
            <table width="420" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#ffffff;border-radius:12px;overflow:hidden;max-width:420px;border:1px solid #e5e7eb;">

                <!-- HEADER -->
                <tr>
                    <td style="background-color:#1C4D8D;padding:24px 32px;text-align:center;">
                        <span style="font-size:20px;font-weight:800;color:#ffffff;">✓ ICheck</span>
                    </td>
                </tr>

                <!-- BODY -->
                <tr>
                    <td style="padding:36px 32px;text-align:center;">
                        <div style="font-size:20px;font-weight:700;color:#1C4D8D;margin-bottom:10px;">
                            Your OTP Code
                        </div>

                        <p style="font-size:14px;color:#6b7280;line-height:1.6;margin:0 0 24px;">
                            Enter the code below to verify your account and start checking in to your sessions.
                        </p>

                        <div style="background:#eef2f8;border:1px dashed #1C4D8D;border-radius:10px;padding:16px;
                                    font-size:30px;font-weight:800;color:#1C4D8D;letter-spacing:10px;margin-bottom:20px;">
                            <span th:text="${otp}">123456</span>
                        </div>

                        <p style="font-size:13px;color:#9ca3af;line-height:1.6;margin:0;">
                            Expires in <strong th:text="${expiryMinutes} + ' minutes'">5 minutes</strong>.
                            If you didn't request this, ignore this email.
                        </p>
                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td style="background:#f7f7fa;padding:18px 32px;text-align:center;border-top:1px solid #eeeef4;">
                        <p style="font-size:12px;color:#a0a0b8;margin:0;">
                            © <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> ICheck — University Attendance System
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
