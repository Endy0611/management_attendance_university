services:
  proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy_manager
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP Traffic
      - "443:443"     # HTTPS Traffic
      - "127.0.0.1:81:81" # NPM Admin UI (Locked to Localhost/SSH Tunnel)
    volumes:
      - ./proxy_data:/data
      - ./proxy_letsencrypt:/etc/letsencrypt
    networks:
      - app-network

  db:
    image: postgres:17
    container_name: postgres_container
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${DATASOURCE_PASSWORD}
      - POSTGRES_DB=${DATASOURCE_DB}
    volumes:
      - data_v3:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATASOURCE_USERNAME} -d ${DATASOURCE_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis_container
    restart: always
    networks:
      - app-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001" # RustFS Manager Console (Locked to Localhost)
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    command: >
      --address :9000
      --console-enable
      /data
    networks:
      - app-network

  face-api:
    build: ../face-api
    container_name: face-api
    restart: unless-stopped
    volumes:
      - face-api_models:/root/.deepface
    networks:
      - app-network

  backend:
    build: .
    container_name: spring_backend
    mem_limit: 640m
    ports:
      - "127.0.0.1:9090:8080" # Maps host 9090 -> container 8080
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
      face-api:
        condition: service_started
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_container:5432/${DATASOURCE_DB}
      - SPRING_DATASOURCE_USERNAME=${DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis_container
      - SPRING_DATA_REDIS_PORT=6379
    restart: on-failure
    networks:
      - app-network

volumes:
  data_v3:
    name: hrd-eventhub-api_data_v3
    external: true
  rustfs_data:
  face-api_models:

networks:
  app-network:
    name: app-network
    driver: bridge