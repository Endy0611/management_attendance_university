services:
  proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy_manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81" # Restricted admin UI to local server / SSH tunnel
    volumes:
      - ./proxy_data:/data
      - ./proxy_letsencrypt:/etc/letsencrypt
    networks:
      - app-network

  db:
    image: postgres:18
    container_name: postgres_container
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${DATASOURCE_PASSWORD}
      - POSTGRES_DB=${DATASOURCE_DB}
    volumes:
      - data_v3:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432" # Secure DB from external access
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATASOURCE_USERNAME} -d ${DATASOURCE_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "127.0.0.1:6379:6379" # Secure Redis from external access
    restart: always
    networks:
      - app-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001" # Secure console UI
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    command: >
      --address :9000
      --console-enable
      /data
    networks:
      - app-network

  face-api:
    build: ../face-api
    container_name: face-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - face-api_models:/root/.deepface
    networks:
      - app-network

  backend:
    build: .
    container_name: spring_backend
    mem_limit: 640m
    ports:
      - "127.0.0.1:9090:9090" # Frees port 8080 for Jenkins!
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
      face-api:
        condition: service_started
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DATASOURCE_DB}
      - SPRING_DATASOURCE_USERNAME=${DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    restart: on-failure
    networks:
      - app-network

volumes:
  data_v3:
  rustfs_data:
  face-api_models:

networks:
  app-network:
    name: app-network
    driver: bridge