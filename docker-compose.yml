services:
  db:
    image: postgres:18
    container_name: postgres_container
    environment:
      - POSTGRES_USER=${DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${DATASOURCE_PASSWORD}
      - POSTGRES_DB=${DATASOURCE_URL}
    volumes:
      - data_v3:/var/lib/postgresql
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    restart: always

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_local
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    command: >
      --address :9000
      --console-enable
      /data

  backend:
    build: .
    container_name: spring_backend
    mem_limit: 640m
    ports:
      - "8080:9090"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rustfs
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_URL=${DATASOURCE_URL}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

volumes:
  data_v3:
  rustfs_data: